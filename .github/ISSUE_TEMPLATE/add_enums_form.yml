name: Request New Valid Values
description: This issue form collects details for adding new valid values (akak enumerations) to existing data model attributes
title: "[ADD_ENUM]: "
labels: ["enhancement"]
assignees:
  - jmvera255
type: enhancement
body:
  - type: input
    id: Attribute
    attributes:
      label: data model attribute
      description: please enter the data model attribute to add your new valid values
      placeholder: ex. biospecimenType
    validations:
      required: true
  - type: input
    id: Enums
    attributes:
      label: Valid values
      description: Please enter the new valid value(s); multiple new valid values can be provided using a comma-delimited list
      placeholder: ex. synovial fluid, kidney biopsy
    validations:
      required: true
  - type: markdown
  attributes:
    value: "Thanks for completing our form! The ARK Portal team will review this request for incorporation into the data model"