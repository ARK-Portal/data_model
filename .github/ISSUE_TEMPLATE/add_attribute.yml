name: Request New Data Model Attribute
description: This issue form collects details for adding a new atttribute (aka field) to the data model
title: "[ADD_ATTRIBUTE]: "
labels: ["enhancement"]
assignees:
  - jmvera255
type: enhancement
body:
  - type: input
    id: Attribute
    attributes:
      label: New Data Model Attribute
      description: Please provide the string/name of the new attribute. Keep in mind ARK's camelCase syntax for attribute strings
      placeholder: ex. myNewAttribute
    validations:
      required: true
  - type: input
    id: Description
    attributes:
      label: Attribute Description
      description: Please provide a clear description of the attribute.
    validations:
      required: true
  - type: input
    id: Enums
    attributes:
      label: Valid values
      description: If applicabel, please enter valid value(s) that should be defined for this attribute; multiple new valid values can be provided using a comma-delimited list
      placeholder: ex. value 1, value 2, value 3
    validations:
      required: false
  - type: textarea
    id: Justification
    attributes:
      label: Rationale for Attribute Addition
      description: Please provide clear justification and rationale for the addition of this attribute. Rationale should include clear use cases and specifications for use within specific templates or data types.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Thanks for completing our form! The ARK Portal team will review this request for incorporation into the data model